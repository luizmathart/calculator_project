<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator Project</title>
</head>
<body>
    <main>
        <div id="display">00000</div>

        <div id="line_1" class="grid_layout">
            <button id="button_ac" class="grid_cards">AC</button>
            <button id="button_$" class="grid_cards">$</button>
            <button id="button_%" class="grid_cards">%</button>
            <button id="button_/" class="grid_cards">/</button>
        </div>

        <div id="line_2" class="grid_layout">
            <button id="button_7" class="grid_cards">7</button>
            <button id="button_8" class="grid_cards">8</button>
            <button id="button_9" class="grid_cards">9</button>
            <button id="button_X" class="grid_cards">X</button>
        </div>

        <div id="line_3" class="grid_layout">
            <button id="button_4" class="grid_cards">4</button>
            <button id="button_5" class="grid_cards">5</button>
            <button id="button_6" class="grid_cards">6</button>
            <button id="button_-" class="grid_cards">-</button>
        </div>

        <div id="line_4" class="grid_layout">
            <button id="button_3" class="grid_cards">3</button>
            <button id="button_2" class="grid_cards">2</button>
            <button id="button_1" class="grid_cards">1</button>
            <button id="button_+" class="grid_cards">+</button>
        </div>

        <div id="line 5" class="grid_layout_exception">
            <button id="button_0" class="grid_cards">0</button>
            <button id="button_." class="grid_cards">.</button>
            <button id="button_equal" class="grid_cards">=</button>
        </div>
    </main>
</body>
</html>
