<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Calculator Project</title>
</head>
<body>
    <main>
        <div id="display"></div>

        <div id="line_1" class="grid_layout">
            <button id="button_ac" class="">AC</button>
            <button id="button_$" class="">$</button>
            <button id="button_%" class="">%</button>
            <button id="button_/" class="operation_button">/</button>
        </div>

        <div id="line_2" class="grid_layout">
            <button id="button_7" class="num_button">7</button>
            <button id="button_8" class="num_button">8</button>
            <button id="button_9" class="num_button">9</button>
            <button id="button_X" class="operation_button">X</button>
        </div>

        <div id="line_3" class="grid_layout">
            <button id="button_4" class="num_button">4</button>
            <button id="button_5" class="num_button">5</button>
            <button id="button_6" class="num_button">6</button>
            <button id="button_-" class="operation_button">-</button>
        </div>

        <div id="line_4" class="grid_layout">
            <button id="button_3" class="num_button">3</button>
            <button id="button_2" class="num_button">2</button>
            <button id="button_1" class="num_button">1</button>
            <button id="button_+" class="operation_button">+</button>
        </div>

        <div id="line_5" class="grid_layout_exception">
            <button id="button_0" class="num_button">0</button>
            <button id="button_." class="num_button">.</button>
            <button id="button_equal" class="">=</button>
        </div>

    </main>
</body>
</html>
